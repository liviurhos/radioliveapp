<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadioLive - Download</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }
  .wrap {
    padding: 24px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #333333;
    border-top: 3px solid #ffffff;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  p {
    font-size: 14px;
    color: #999999;
    margin: 0;
  }
  a {
    color: #ffffff;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <p>Redirecting to RadioLive...</p>
  <p style="margin-top: 8px;"><a id="fallback" href="#">Tap here if not redirected</a></p>
</div>

<script>
  var APP_STORE_URL = "https://apps.apple.com/app/id6781333086";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.innovationhubstudio.radiolive";

  function getTargetUrl() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      return APP_STORE_URL;
    }

    if (/android/i.test(ua)) {
      return PLAY_STORE_URL;
    }

    // Desktop or unknown device fallback
    return PLAY_STORE_URL;
  }

  var target = getTargetUrl();
  document.getElementById("fallback").href = target;
  window.location.replace(target);
</script>
</body>
</html>
